<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teste de carro: cor, vidros e faróis</title>
<style>
  :root { --bg:#14161a; --panel:#1d2026; --line:#2c313a; --fg:#e7e9ee; --muted:#8b93a1; --acc:#4da3ff; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px system-ui,sans-serif; background:var(--bg); color:var(--fg); display:grid; grid-template-columns:280px 1fr; height:100vh; }
  aside { background:var(--panel); border-right:1px solid var(--line); padding:14px; display:flex; flex-direction:column; gap:12px; overflow:auto; }
  h1 { font-size:16px; margin:0; }
  label { display:block; color:var(--muted); font-size:12px; margin-bottom:4px; }
  input[type=color] { width:100%; height:38px; border:1px solid var(--line); border-radius:6px; background:var(--bg); padding:2px; }
  .sw { display:flex; gap:6px; flex-wrap:wrap; }
  .sw button { width:34px; height:34px; border-radius:50%; border:2px solid var(--line); cursor:pointer; }
  button.t { padding:9px; border:0; border-radius:6px; background:var(--line); color:var(--fg); font-weight:600; cursor:pointer; }
  button.t.on { background:var(--acc); color:#fff; }
  canvas { width:100%; height:100%; display:block; }
  small { color:var(--muted); line-height:1.4; }
  #msg { font-size:12px; color:var(--muted); }
</style>
</head>
<body>
<aside>
  <h1>Cor, vidros e faróis</h1>
  <div><label>Arquivo GLB</label><input id="file" type="file" accept=".glb,.gltf"></div>
  <div><label>Cor da carroceria (material <code>CarPaint</code>)</label><input id="color" type="color" value="#ffc400"></div>
  <div class="sw" id="sw"></div>
  <div class="sw" id="views"></div>
  <button class="t on" id="lights">Faróis ligados</button>
  <button class="t" id="night">Modo noite</button>
  <div id="msg"></div>
  <small>Em código: <code>mat.color.set('#ff0000')</code> no material cujo <code>userData.recolorable</code> é verdadeiro; faróis: <code>SpotLight</code> <code>Headlight_L_Spot</code>/<code>Headlight_R_Spot</code> e <code>emissiveIntensity</code> do material <code>HeadlightBulb</code>.</small>
</aside>
<canvas id="c"></canvas>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const $ = (id) => document.getElementById(id);
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(devicePixelRatio);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x14161a);
const ENV = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
scene.environment = ENV;
const camera = new THREE.PerspectiveCamera(45, 1, 0.05, 200);
camera.position.set(4.5, 1.8, -5.5);
const controls = new OrbitControls(camera, canvas);
controls.target.set(0, 0.6, 0);
const sun = new THREE.DirectionalLight(0xffffff, 1.2);
sun.position.set(3, 6, 2);
scene.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.MeshStandardMaterial({ color: 0x3a3f48, roughness: 0.9 }));
ground.rotation.x = -Math.PI / 2;
scene.add(ground);
scene.add(new THREE.GridHelper(60, 60, 0x4a505a, 0x2a2f37));

let car = null;
const paintMats = [], spots = [], bulbs = [];
function setColor(hex) { paintMats.forEach((m) => m.color.set(hex)); }
function load(url) {
  new GLTFLoader().load(url, (g) => {
    if (car) scene.remove(car);
    car = g.scene;
    paintMats.length = spots.length = bulbs.length = 0;
    car.traverse((o) => {
      if (o.isSpotLight) { spots.push(o); o.castShadow = false; }
      if (o.isMesh) (Array.isArray(o.material) ? o.material : [o.material]).forEach((m) => {
        if (m.userData?.recolorable && !paintMats.includes(m)) paintMats.push(m);
        if (m.name === 'HeadlightBulb' && !bulbs.includes(m)) bulbs.push(m);
      });
    });
    scene.add(car);
    $('msg').textContent = `${paintMats.length} material(is) de tinta, ${spots.length} spot(s) de farol, ${bulbs.length} lâmpada(s).`;
    if (paintMats[0]) setColor($('color').value);
  }, undefined, (e) => ($('msg').textContent = 'Erro ao carregar: ' + (e.message || e)));
}
$('file').onchange = (e) => e.target.files[0] && load(URL.createObjectURL(e.target.files[0]));
$('color').oninput = (e) => setColor(e.target.value);
for (const c of ['#c8102e', '#0b3d91', '#111111', '#f2f2f2', '#ffc400', '#1f7a3a', '#7d8590', '#ff6a00']) {
  const b = document.createElement('button');
  b.style.background = c; b.title = c;
  b.onclick = () => { $('color').value = c; setColor(c); };
  $('sw').appendChild(b);
}
const VIEWS = { Frente: [0, 0.9, 5.6], 'Frente 3/4': [3.8, 1.5, 4.2], Lado: [6.2, 1.0, 0], Trás: [0, 1.2, -5.6], 'Faróis (perto)': [1.2, 0.8, 3.0] };
for (const [name, p] of Object.entries(VIEWS)) {
  const b = document.createElement('button');
  b.className = 't'; b.textContent = name; b.style.padding = '6px 8px';
  b.onclick = () => { camera.position.set(...p); controls.target.set(0, name.startsWith('Far') ? 0.65 : 0.6, name.startsWith('Far') ? 1.6 : 0); };
  $('views').appendChild(b);
}
window.__view = (name) => $('views').children[Object.keys(VIEWS).indexOf(name)].click();
let lightsOn = true, night = false;
function applyLights() {
  spots.forEach((s) => (s.visible = lightsOn));
  bulbs.forEach((m) => (m.emissiveIntensity = lightsOn ? 12 : 0));
  $('lights').classList.toggle('on', lightsOn);
  $('lights').textContent = lightsOn ? 'Faróis ligados' : 'Faróis desligados';
}
$('lights').onclick = () => { lightsOn = !lightsOn; applyLights(); };
$('night').onclick = () => {
  night = !night;
  scene.environment = night ? null : ENV;
  sun.intensity = night ? 0.05 : 1.2;
  scene.background = new THREE.Color(night ? 0x05070a : 0x14161a);
  $('night').classList.toggle('on', night);
};
function resize() { const r = canvas.parentElement; renderer.setSize(canvas.clientWidth, canvas.clientHeight, false); camera.aspect = canvas.clientWidth / canvas.clientHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
const q = new URLSearchParams(location.search);
if (q.get('glb')) load(q.get('glb'));
new MutationObserver(applyLights).observe($('msg'), { childList: true, characterData: true, subtree: true });
</script>
</body>
</html>
